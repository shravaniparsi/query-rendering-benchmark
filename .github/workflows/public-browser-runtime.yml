name: Public Browser Startup Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event.repository.private == false && github.repository == 'shravaniparsi/query-rendering-benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install pinned dependencies without caches
        run: |
          python -m pip install --no-cache-dir -r apps/issue-dashboard/requirements.txt psycopg==3.2.10 psycopg-binary==3.2.10 typing_extensions==4.16.0 psutil==7.2.2
          cd apps/issue-dashboard
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Verify contracts and prepare actual browser cpusets
        run: |
          python scripts/check_main_contracts.py --output ci-artifacts/main-contracts.json
          read -r QRL_FIRST_CPU QRL_SECOND_CPU <<< "$(python -c 'import os; a=sorted(os.sched_getaffinity(0)); assert len(a)>=4; print(a[0],a[1])')"
          sudo -n python3 scripts/prepare_browser_cgroups.py --target "$QRL_FIRST_CPU" --observer "$QRL_SECOND_CPU" --output ci-artifacts/browser-cgroups.json
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
      - name: Exercise actual non-root contained Chromium without application requests
        run: python scripts/check_browser_runtime.py --output ci-artifacts/browser-runtime
      - name: Preserve every available startup diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QRL_REPO: ${{ github.repository }}
          QRL_RUN_ID: ${{ github.run_id }}
          QRL_RUN_ATTEMPT: ${{ github.run_attempt }}
          QRL_SOURCE: ${{ github.sha }}
        run: |
          mkdir -p ci-artifacts
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('ci-artifacts/run-identity.json').write_text(json.dumps({'run_id':os.environ['QRL_RUN_ID'],'run_attempt':os.environ['QRL_RUN_ATTEMPT'],'source_commit':os.environ['QRL_SOURCE'],'role':'browser startup and containment only','application_requests_sent':0,'comparative_performance_acquired':False},indent=2)+'\n')
          PY
          QRL_STEM="public-browser-runtime-${QRL_RUN_ID}-${QRL_RUN_ATTEMPT}"
          python scripts/bundle_public_output.py --source ci-artifacts --bundle "/tmp/${QRL_STEM}.tar.gz" --manifest "/tmp/${QRL_STEM}.json"
          QRL_TAG="browser-runtime-${QRL_RUN_ID}"
          printf '%s\n' 'Actual non-root Node/Chromium startup, privilege drop and cpuset containment. No application requests, database or comparative performance acquisition.' > /tmp/qrl-browser-runtime-notes.txt
          if ! gh release view "$QRL_TAG" --repo "$QRL_REPO" >/dev/null 2>&1; then
            gh release create "$QRL_TAG" --repo "$QRL_REPO" --target "$QRL_SOURCE" --title "Browser runtime ${QRL_RUN_ID}" --notes-file /tmp/qrl-browser-runtime-notes.txt
          fi
          gh release upload "$QRL_TAG" --repo "$QRL_REPO" "/tmp/${QRL_STEM}.tar.gz" "/tmp/${QRL_STEM}.json"
