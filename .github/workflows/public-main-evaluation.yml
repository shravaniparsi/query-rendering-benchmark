name: Reserved Main Evaluation

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [network-check, qualification, main]
        default: qualification
        description: Qualification is excluded from main estimates
      day:
        type: string
        default: ''
        description: Actual predeclared UTC date; blank selects today
  schedule:
    - cron: '0 10 * * *'

permissions:
  contents: read

concurrency:
  group: frozen-reserved-calendar
  cancel-in-progress: false

jobs:
  network-check:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'network-check' &&
      github.event.repository.private == false && vars.QRL_STANDARD_TAGGED_NETWORK_APPROVED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: [inventory, analytics]
        role: [target, observer]
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QRL_STANDARD_TAGGED_NETWORK_APPROVED: ${{ vars.QRL_STANDARD_TAGGED_NETWORK_APPROVED }}
      QRL_NETWORK_EXECUTION_SHA: ${{ vars.QRL_NETWORK_EXECUTION_SHA }}
      QRL_TS_CLIENT_ID: ${{ vars.QRL_TS_CLIENT_ID }}
      QRL_TS_AUDIENCE: ${{ vars.QRL_TS_AUDIENCE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - name: Verify manual public source and bounded network-only permission
        env:
          GH_TOKEN: ${{ github.token }}
          QRL_TASK: ${{ matrix.task }}
          QRL_ROLE: ${{ matrix.role }}
        run: |
          python -m unittest discover -s tests -p test_public_execution.py
          python scripts/public_network_check.py verify --task "$QRL_TASK" --role "$QRL_ROLE"
      - name: Register one standard tagged research node
        id: register
        env:
          QRL_GITHUB_READ_TOKEN: ${{ github.token }}
          QRL_TASK: ${{ matrix.task }}
          QRL_ROLE: ${{ matrix.role }}
        run: python scripts/research_network.py register --task "$QRL_TASK" --role "$QRL_ROLE" --output ci-artifacts/network-registration.json
      - name: Verify private paired direct connectivity without application measurements
        id: connect
        env:
          QRL_TASK: ${{ matrix.task }}
          QRL_ROLE: ${{ matrix.role }}
        run: python scripts/offhost_connectivity.py --task "$QRL_TASK" --role "$QRL_ROLE" --require-direct true
      - name: Delete only this job's verified research node and confirm API absence
        if: always()
        id: cleanup
        env:
          QRL_TASK: ${{ matrix.task }}
          QRL_ROLE: ${{ matrix.role }}
        run: python scripts/research_network.py cleanup --task "$QRL_TASK" --role "$QRL_ROLE" --output ci-artifacts/network-registration.json
      - name: Retain every available network-only output as immutable release assets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QRL_TASK: ${{ matrix.task }}
          QRL_ROLE: ${{ matrix.role }}
          QRL_REGISTRATION_OUTCOME: ${{ steps.register.outcome }}
          QRL_CONNECTIVITY_OUTCOME: ${{ steps.connect.outcome }}
          QRL_CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: python scripts/public_network_check.py publish --task "$QRL_TASK" --role "$QRL_ROLE"

  configuration:
    if: >-
      github.event.repository.private == false &&
      ((github.event_name == 'schedule' && vars.QRL_MAIN_ENABLED == 'true') ||
      (inputs.mode == 'main' && vars.QRL_MAIN_ENABLED == 'true') ||
      (inputs.mode == 'qualification' && vars.QRL_QUALIFICATION_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      acquire: ${{ steps.claim.outputs.acquire }}
      day: ${{ steps.claim.outputs.day }}
      mode: ${{ steps.claim.outputs.mode }}
      claim_sha: ${{ steps.claim.outputs.claim_sha }}
      release_tag: ${{ steps.claim.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - name: Claim one immutable source-bound attempt for this real calendar date
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          QRL_FROZEN_EXECUTION_SHA: ${{ vars.QRL_FROZEN_EXECUTION_SHA }}
          QRL_RELEASE_SHA256: ${{ vars.QRL_RELEASE_SHA256 }}
          QRL_MODE: ${{ inputs.mode || 'main' }}
          QRL_REQUESTED_DAY: ${{ inputs.day }}
          QRL_STANDARD_TAGGED_NETWORK_APPROVED: ${{ vars.QRL_STANDARD_TAGGED_NETWORK_APPROVED }}
          QRL_TS_CLIENT_ID: ${{ vars.QRL_TS_CLIENT_ID }}
          QRL_TS_AUDIENCE: ${{ vars.QRL_TS_AUDIENCE }}
        run: python scripts/claim_public_date.py --release release/release.json --release-sha256 "$QRL_RELEASE_SHA256" --mode "$QRL_MODE" --day "$QRL_REQUESTED_DAY"

  collection:
    needs: configuration
    if: needs.configuration.outputs.acquire == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: [inventory, analytics]
        role: [target, observer]
    services:
      postgres:
        image: ${{ matrix.role == 'target' && 'postgres:18.0@sha256:41fc5342eefba6cc2ccda736aaf034bbbb7c3df0fdb81516eba1ba33f360162c' || '' }}
        env:
          POSTGRES_USER: qrl
          POSTGRES_PASSWORD: qrl_disposable_ci
          POSTGRES_DB: reserved_main
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U qrl -d reserved_main"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QRL_TEST_DATABASE_URL: postgresql://qrl:qrl_disposable_ci@127.0.0.1:5432/reserved_main
      QRL_FROZEN_EXECUTION_SHA: ${{ vars.QRL_FROZEN_EXECUTION_SHA }}
      QRL_RELEASE_SHA256: ${{ vars.QRL_RELEASE_SHA256 }}
      QRL_REPOSITORY_VISIBILITY: ${{ github.event.repository.private == false && 'public' || 'private' }}
      QRL_DATE_CLAIM_RUN_ID: ${{ github.run_id }}
      QRL_DATE_CLAIM_SHA: ${{ needs.configuration.outputs.claim_sha }}
      QRL_DAY: ${{ needs.configuration.outputs.day }}
      QRL_MODE: ${{ needs.configuration.outputs.mode }}
      QRL_RELEASE_TAG: ${{ needs.configuration.outputs.release_tag }}
      QRL_STANDARD_TAGGED_NETWORK_APPROVED: ${{ vars.QRL_STANDARD_TAGGED_NETWORK_APPROVED }}
      QRL_TS_CLIENT_ID: ${{ vars.QRL_TS_CLIENT_ID }}
      QRL_TS_AUDIENCE: ${{ vars.QRL_TS_AUDIENCE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.role == 'observer'
        with:
          node-version: '24.22.1'
      - name: Install pinned dependencies without caches
        run: python -m pip install --no-cache-dir -r apps/issue-dashboard/requirements.txt psycopg==3.2.10 psycopg-binary==3.2.10 typing_extensions==4.16.0 psutil==7.2.2
      - name: Install locked observer browser
        if: matrix.role == 'observer'
        working-directory: apps/issue-dashboard
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Verify frozen decision and pre-acquisition contracts
        run: |
          python scripts/check_decision_contracts.py --output ci-artifacts/decision-contracts.json
          python scripts/check_main_contracts.py --output ci-artifacts/main-contracts.json
      - name: Record full host and target database placement
        env:
          QRL_CONTAINER: ${{ job.services.postgres.id }}
          QRL_ROLE: ${{ matrix.role }}
        run: |
          uname -a > ci-artifacts/host-uname.txt
          lscpu --json > ci-artifacts/host-cpu.json
          if [ "$QRL_ROLE" = target ]; then
            docker inspect --format '{{.Image}}' "$QRL_CONTAINER" > ci-artifacts/postgres-image-id.txt
            QRL_DB_CPU=$(python -c 'import os; a=sorted(os.sched_getaffinity(0)); assert len(a)>=4; print(a[1])')
            QRL_DB_PID=$(docker inspect --format '{{.State.Pid}}' "$QRL_CONTAINER")
            echo "QRL_DB_CPU=$QRL_DB_CPU" >> "$GITHUB_ENV"
            echo "QRL_POSTGRES_HOST_PID=$QRL_DB_PID" >> "$GITHUB_ENV"
            echo "QRL_POSTGRES_CONTAINER=$QRL_CONTAINER" >> "$GITHUB_ENV"
            docker update --cpuset-cpus "$QRL_DB_CPU" "$QRL_CONTAINER"
          fi
      - name: Enforce observer browser cpuset and verify clocks before acquisition
        if: matrix.role == 'observer'
        run: |
          read -r QRL_FIRST_CPU QRL_SECOND_CPU <<< "$(python -c 'import os; a=sorted(os.sched_getaffinity(0)); assert len(a)>=4; print(a[0],a[1])')"
          sudo -n python3 scripts/prepare_browser_cgroups.py --target "$QRL_FIRST_CPU" --observer "$QRL_SECOND_CPU" --output ci-artifacts/browser-cgroups.json
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          python scripts/check_browser_clock.py --output ci-artifacts/browser-clock-contract.json
      - name: Determine the application-specific private pair name
        env:
          QRL_TASK: ${{ matrix.task }}
          QRL_ROLE: ${{ matrix.role }}
        run: |
          if [ "$QRL_TASK" = inventory ]; then QRL_SUFFIX=0; else QRL_SUFFIX=1; fi
          echo "QRL_OVERLAY_NAME=qrl-${GITHUB_RUN_ID}${QRL_SUFFIX}-1-${QRL_ROLE}" >> "$GITHUB_ENV"
      - name: Register one standard tagged research node using short-lived OIDC
        env:
          QRL_GITHUB_READ_TOKEN: ${{ github.token }}
          QRL_TASK: ${{ matrix.task }}
          QRL_ROLE: ${{ matrix.role }}
        run: python scripts/research_network.py register --task "$QRL_TASK" --role "$QRL_ROLE" --output ci-artifacts/network-registration.json
      - name: Acquire the exact claimed qualification or main panel
        id: acquire
        env:
          QRL_GITHUB_READ_TOKEN: ${{ github.token }}
          QRL_TASK: ${{ matrix.task }}
          QRL_ROLE: ${{ matrix.role }}
        run: |
          QRL_SMOKE=()
          if [ "$QRL_MODE" = qualification ]; then QRL_SMOKE=(--smoke); fi
          python scripts/offhost_main_evaluation.py --task "$QRL_TASK" --role "$QRL_ROLE" --day "$QRL_DAY" --release release/release.json --release-sha256 "$QRL_RELEASE_SHA256" "${QRL_SMOKE[@]}"
      - name: Remove only this job's standard research node and verify its absence
        if: always()
        env:
          QRL_TASK: ${{ matrix.task }}
          QRL_ROLE: ${{ matrix.role }}
        run: python scripts/research_network.py cleanup --task "$QRL_TASK" --role "$QRL_ROLE" --output ci-artifacts/network-registration.json
      - name: Preserve completed and interrupted role evidence without Actions artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QRL_COLLECTION_STEP_OUTCOME: ${{ steps.acquire.outcome }}
          QRL_TASK: ${{ matrix.task }}
          QRL_ROLE: ${{ matrix.role }}
        run: python scripts/publish_main_evidence.py --task "$QRL_TASK" --role "$QRL_ROLE" --day "$QRL_DAY" --mode "$QRL_MODE" --claim-sha "$QRL_DATE_CLAIM_SHA" --release-sha256 "$QRL_RELEASE_SHA256" --release-tag "$QRL_RELEASE_TAG"
