name: Preserve Public Execution Logs

on:
  workflow_run:
    workflows: ['Public Benchmark Preflight', 'Reserved Main Evaluation', 'Public Release Preparation', 'Public Application Replay', 'Public Browser Startup Check']
    types: [completed]

permissions:
  contents: read

jobs:
  preserve:
    if: >-
      github.event.repository.private == false &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      QRL_REPO: ${{ github.repository }}
      QRL_RUN_ID: ${{ github.event.workflow_run.id }}
      QRL_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      QRL_SOURCE: ${{ github.event.workflow_run.head_sha }}
      QRL_WORKFLOW: ${{ github.event.workflow_run.name }}
    steps:
      - name: Retain completed job metadata and complete masked Actions logs
        run: |
          if [ "$QRL_WORKFLOW" = 'Public Benchmark Preflight' ]; then
            QRL_STEM="public-validation-${QRL_RUN_ID}-${QRL_RUN_ATTEMPT}"
            QRL_TAG="validation-${QRL_RUN_ID}"
          elif [ "$QRL_WORKFLOW" = 'Reserved Main Evaluation' ]; then
            QRL_STEM="public-execution-${QRL_RUN_ID}-${QRL_RUN_ATTEMPT}"
            QRL_TAG="execution-${QRL_RUN_ID}"
          elif [ "$QRL_WORKFLOW" = 'Public Release Preparation' ]; then
            QRL_STEM="public-release-preparation-${QRL_RUN_ID}-${QRL_RUN_ATTEMPT}"
            QRL_TAG="release-preparation-${QRL_RUN_ID}"
          elif [ "$QRL_WORKFLOW" = 'Public Application Replay' ]; then
            QRL_STEM="public-application-replay-${QRL_RUN_ID}-${QRL_RUN_ATTEMPT}"
            QRL_TAG="replay-execution-${QRL_RUN_ID}"
          elif [ "$QRL_WORKFLOW" = 'Public Browser Startup Check' ]; then
            QRL_STEM="public-browser-runtime-${QRL_RUN_ID}-${QRL_RUN_ATTEMPT}"
            QRL_TAG="browser-runtime-${QRL_RUN_ID}"
          else
            exit 1
          fi
          gh run view "$QRL_RUN_ID" --repo "$QRL_REPO" --attempt "$QRL_RUN_ATTEMPT" --json databaseId,headSha,status,conclusion,jobs,url,createdAt,updatedAt,event,workflowName > "/tmp/${QRL_STEM}-metadata.json"
          if ! gh run view "$QRL_RUN_ID" --repo "$QRL_REPO" --attempt "$QRL_RUN_ATTEMPT" --log > "/tmp/${QRL_STEM}-all-jobs.log" 2> /tmp/qrl-log-read-error.txt; then
            if jq -e '.conclusion == "skipped" and all(.jobs[]; .conclusion == "skipped")' "/tmp/${QRL_STEM}-metadata.json" >/dev/null; then
              printf '%s\n' 'Provider metadata reports an entirely skipped parent; no job logs were generated. Original log-read response follows.' > "/tmp/${QRL_STEM}-all-jobs.log"
              cat /tmp/qrl-log-read-error.txt >> "/tmp/${QRL_STEM}-all-jobs.log"
            else
              cat /tmp/qrl-log-read-error.txt >&2
              exit 1
            fi
          fi
          if [ ! -s "/tmp/${QRL_STEM}-all-jobs.log" ]; then
            if jq -e '.conclusion == "skipped" and all(.jobs[]; .conclusion == "skipped")' "/tmp/${QRL_STEM}-metadata.json" >/dev/null; then
              printf '%s\n' 'Provider metadata reports an entirely skipped parent; the log endpoint returned zero bytes and no job logs were generated.' > "/tmp/${QRL_STEM}-all-jobs.log"
            else
              printf '%s\n' 'An executed parent returned an empty log; refusing to replace missing evidence with a skipped-run marker.' >&2
              exit 1
            fi
          fi
          printf '%s\n' 'Retained run metadata and masked complete job logs, including failed attempts. Network checks, qualification and main evidence remain distinguished by the original run and role reports.' > /tmp/qrl-log-notes.txt
          if ! gh release view "$QRL_TAG" --repo "$QRL_REPO" >/dev/null 2>&1; then
            gh release create "$QRL_TAG" --repo "$QRL_REPO" --target "$QRL_SOURCE" --title "Benchmark execution ${QRL_RUN_ID}" --notes-file /tmp/qrl-log-notes.txt
          fi
          gh release upload "$QRL_TAG" --repo "$QRL_REPO" "/tmp/${QRL_STEM}-metadata.json" "/tmp/${QRL_STEM}-all-jobs.log"
