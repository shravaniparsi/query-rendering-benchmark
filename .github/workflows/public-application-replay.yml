name: Public Application Replay

on:
  workflow_run:
    workflows: ['Reserved Main Evaluation']
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  QRL_FROZEN_EXECUTION_SHA: ${{ vars.QRL_FROZEN_EXECUTION_SHA }}
  QRL_RELEASE_SHA256: ${{ vars.QRL_RELEASE_SHA256 }}
  QRL_PARENT_RUN: ${{ github.event.workflow_run.id }}

jobs:
  inspect:
    if: >-
      github.event.repository.private == false && github.repository == 'shravaniparsi/query-rendering-benchmark' &&
      vars.QRL_FROZEN_EXECUTION_SHA != '' && github.event.workflow_run.head_sha == vars.QRL_FROZEN_EXECUTION_SHA &&
      github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      claimed: ${{ steps.inspect.outputs.claimed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ vars.QRL_FROZEN_EXECUTION_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - name: Install pinned Python dependencies without caches
        run: python -m pip install --no-cache-dir -r apps/issue-dashboard/requirements.txt psycopg==3.2.10 psycopg-binary==3.2.10 typing_extensions==4.16.0 psutil==7.2.2
      - name: Resolve the actual immutable acquisition claim
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/inspect_public_attempt.py --run-id "$QRL_PARENT_RUN" --output ci-artifacts/parent-attempt.json

  replay:
    needs: inspect
    if: needs.inspect.outputs.claimed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: [inventory, analytics]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ vars.QRL_FROZEN_EXECUTION_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - name: Install pinned Python dependencies without caches
        run: python -m pip install --no-cache-dir -r apps/issue-dashboard/requirements.txt psycopg==3.2.10 psycopg-binary==3.2.10 typing_extensions==4.16.0 psutil==7.2.2
      - name: Replay paired raw evidence and retain passed or unavailable components
        env:
          GH_TOKEN: ${{ github.token }}
          QRL_TASK: ${{ matrix.task }}
        run: python scripts/replay_public_application.py --run-id "$QRL_PARENT_RUN" --task "$QRL_TASK"

  summarize:
    needs: [inspect, replay]
    if: always() && needs.inspect.outputs.claimed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ vars.QRL_FROZEN_EXECUTION_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - name: Install pinned Python dependencies without caches
        run: python -m pip install --no-cache-dir -r apps/issue-dashboard/requirements.txt psycopg==3.2.10 psycopg-binary==3.2.10 typing_extensions==4.16.0 psutil==7.2.2
      - name: Preserve complete and unavailable application weights without interim stopping
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/summarize_public_attempt.py --run-id "$QRL_PARENT_RUN"
